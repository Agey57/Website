<!DOCTYPE html>
<html>
<head>
    <title>Новости</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h1>Новости</h1>
    {% for article in object_list %}
        <div class="card mb-4 shadow-sm">
            <div class="card-body">
                <h2 class="card-title">{{ article.title }}</h2>
                <p class="card-text">{{ article.text|truncatewords:20 }}</p>
                <div class="mb-3">
                    {% for scope in article.scopes.all %}
                        <span class="badge me-1 {% if scope.is_main %}badge-primary{% else %}badge-secondary{% endif %}">
                            {{ scope.tag.name }}
                        </span>
                    {% empty %}
                        <span class="badge bg-warning">Нет тегов</span>
                    {% endfor %}
                </div>
                <small class="text-muted">{{ article.published_at|date:"d.m.Y H:i" }}</small>
            </div>
        </div>
    {% empty %}
        <div class="alert alert-info">Новостей пока нет</div>
    {% endfor %}
</body>
</html>
